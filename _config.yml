# 白石溪 · GitHub Pages 站点配置（经济学人主题 · 按文章区分 accent 色）
title: 白石溪 · White Stone Spring
description: 关于中文写作与思想的持续调查
baseurl: "/WhiteStoneSpring"
repository: zhangxunck/WhiteStoneSpring
markdown_ext: "markdown, mkdown, mkdn, mkd, md"
show_excerpts: false

# 文章走 collection（平铺单层目录，避免 Jekyll 子目录静态拷贝坑）
collections:
  articles:
    output: true
    permalink: /articles/:basename
defaults:
  - scope:
      path: ""
    values:
      accent: "#E3120B"
  - scope:
      collection: "articles"
    values:
      layout: "article"
      type: "article"
