<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="白石溪 White Stone Spring">
  <title>白石溪</title>
  <desc>White Stone Spring wordmark — 白石溪 three-character mark</desc>
  <defs>
    <!-- 印章式红底（白文印：白字红底）-->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81E1E"/>
      <stop offset="100%" stop-color="#9C1414"/>
    </linearGradient>
    <!-- 极简朱印笔触色 -->
    <style>
      .ink{fill:#FDFCF7;font-family:'Songti SC','STSong','SimSun','Noto Serif CJK SC','Source Han Serif SC','serif';font-weight:900;font-size:58px;letter-spacing:14px;paint-order:stroke fill;}
      .mistroke{fill:none;stroke:#FDFCF7;stroke-width:1.6;stroke-opacity:0.35;stroke-linecap:round;stroke-linejoin:round;}
      .seal{fill:#FDFCF7;}
      .frame{fill:none;stroke:#FDFCF7;stroke-width:1.4;stroke-opacity:0.55;}
    </style>
  </defs>

  <!-- 不规则印章边框（八大山人式：右上角缺破、左下角延伸）-->
  <path d="M 8 10 L 350 8 L 352 22 L 350 90 L 320 92 L 22 94 L 6 88 L 4 22 Z" fill="url(#bg)"/>
  <!-- 内框（细线，印章传统）-->
  <path class="frame" d="M 14 16 L 344 14 L 346 28 L 344 86 L 320 88 L 28 90 L 12 84 L 10 28 Z"/>

  <!-- 汉字主体：从左到右 白 / 石 / 溪，居中略偏左上（不对称 = 拙朴）-->
  <!-- 立体主义解构：每个字加一道"错位影子"（stroke 平移 + 错位层）-->
  <g transform="translate(0,-2)">
    <!-- 错位层（向右下偏 2px、半透明白）-->
      <text class="mistroke" x="42" y="68" transform="translate(2,2)">白</text>
      <text class="mistroke" x="146" y="68" transform="translate(2,2)">石</text>
      <text class="mistroke" x="250" y="68" transform="translate(2,2)">溪</text>
    <!-- 主字 -->
      <text class="ink" x="42" y="68">白</text>
      <text class="ink" x="146" y="68">石</text>
      <text class="ink" x="250" y="68">溪</text>
  </g>

  <!-- 八大山人朱印：右下角一个极简"朱痕"小方印（不写任何字，纯色块）-->
  <rect x="296" y="74" width="14" height="14" class="seal" fill-opacity="0.85"/>
  <!-- 朱印下方三道水波纹（呼应"溪"字意象）-->
  <path d="M 2 4 Q 8 2 14 4" class="frame"/>
  <path d="M 354 4 Q 348 2 342 4" class="frame"/>
</svg>
