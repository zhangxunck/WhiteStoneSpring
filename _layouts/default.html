<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}白石溪</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ 'assets/style.css' | relative_url }}">
  {% comment %} accent 色：优先取本页 frontmatter.accent，回退站点默认 {% endcomment %}
  <style>
    :root{ --accent:{{ page.accent | default: site.defaults[0].values.accent }}; }
  </style>
</head>
<body data-layout="{{ page.layout | default: 'page' }}">
  {% if page.layout != 'article' %}
  <div class="site-masthead">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="site-sub">Language · Writing · Ideas</span>
  </div>
  {% endif %}
  <main class="container">
    {{ content }}
  </main>
  <footer class="site-foot">
    <span>白石溪 White Stone Spring</span>
    <span>持续调查 · 数据底座 源库 内部语料库</span>
  </footer>
</body>
</html>
